<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta name="description"
        content="Contact me through my portfolio for questions, opportunities or collaboration.">

    <title>Contact Me | My Portfolio</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <a href="#main-content">Skip to main content</a>

    <header>

        <h1>Contact Me</h1>

        <nav aria-label="Main navigation">
            <a href="index.html">Home</a>
            <a href="projects.html">Projects</a>
            <a href="contact.html">Contact</a>
        </nav>

    </header>

    <main id="main-content">

        <section>

            <h2>Get In Touch</h2>

            <p>
                If you would like to contact me, please fill out the form below.
            </p>

        </section>

        <form aria-label="Contact form">

            <label for="name">Full Name</label>
            <input type="text" id="name" name="name" required>

            <label for="email">Email Address</label>
            <input type="email" id="email" name="email" required>

            <label for="message">Message</label>
            <textarea id="message" name="message" rows="5" required></textarea>

            <button type="submit">Send Message</button>

        </form>

    </main>

    <footer>

        <p>
            &copy; 2026 My Portfolio
        </p>

    </footer>

</body>

</html>
